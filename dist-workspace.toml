[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-pc-windows-gnu", "aarch64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# Custom job to update the Scoop bucket after a release is announced
post-announce-jobs = ["./scoop-publish"]

# Build dependencies to install on CI for the windows-gnu target
[dist.dependencies.chocolatey]
mingw = "*"
