[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-pc-windows-msvc", "x86_64-pc-windows-gnu"]
# Where to host releases
hosting = "github"
# Post-announce jobs to run in CI
github-build-setup = "../ensure-wix.yml"
post-announce-jobs = ["./scoop-publish"]

# Build dependencies to install on CI for the windows-gnu target
[dist.dependencies.chocolatey]
mingw = { targets = ["x86_64-pc-windows-gnu"] }

[dist.github-custom-runners]
aarch64-pc-windows-msvc = "windows-11-arm"
