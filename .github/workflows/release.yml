name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-restore -c Release

      - name: Publish Native AOT
        run: dotnet publish src/NTIX.Cli/NTIX.CLI.csproj -r win-x64 -c Release /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Create portable zip
        shell: bash
        run: |
          cd src/NTIX.Cli/bin/Release/net10.0/win-x64/publish/
          7z a ../../../../../../ntix-${{ steps.version.outputs.VERSION }}-win-x64.zip ntix.exe

      - name: Compile installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: installer/ntix-setup.iss
          options: /DVersion=${{ steps.version.outputs.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NTIX v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            installer/Output/ntix-setup.exe
            ntix-${{ steps.version.outputs.VERSION }}-win-x64.zip

      - name: Update Scoop bucket
        shell: bash
        env:
          BUCKET_TOKEN: ${{ secrets.BUCKET_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          git clone https://x-access-token:${BUCKET_TOKEN}@github.com/Cristiandis/scoop-ntix.git scoop-bucket
          cd scoop-bucket

          HASH=$(curl -sL "https://github.com/Cristiandis/NTIX/releases/download/v${VERSION}/ntix-${VERSION}-win-x64.zip" | sha256sum | cut -d' ' -f1)
          export HASH

          python -c 'import json,os;v=os.environ["VERSION"];h=os.environ["HASH"];m={"version":v,"description":"nix-like package management for Windows","homepage":"https://github.com/Cristiandis/NTIX","license":"GPL-3.0-only","architecture":{"64bit":{"url":f"https://github.com/Cristiandis/NTIX/releases/download/v{v}/ntix-{v}-win-x64.zip","hash":h}},"bin":"ntix.exe","checkver":"github","autoupdate":{"architecture":{"64bit":{"url":"https://github.com/Cristiandis/NTIX/releases/download/v$version/ntix-$version-win-x64.zip"}}}};open("bucket/ntix.json","w").write(json.dumps(m,indent=4))'

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/ntix.json
          git commit -m "Update ntix to v${VERSION}" || echo "No changes to commit"
          git push
