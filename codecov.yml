coverage:
  status:
    project:
      default:
        target: auto
        threshold: 5%
    patch:
      default:
        target: auto
        threshold: 5%

ignore:
  - "src/NTIX.Cli/**"
  - "examples/**"
  - "tests/**"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

flags:
  unittests:
    paths:
      - "src/NTIX.Core/"
    carryforward: true
